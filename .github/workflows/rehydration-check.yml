name: Check Rehydrated Documents Are Up To Date

on:
  push:
    paths:
      - design/**
      - templates/**
      - tools/rehydrate_*.py
      - README.md
      - SPEC.md
      - MECH.md
  pull_request:
    paths:
      - design/**
      - templates/**
      - tools/rehydrate_*.py
      - README.md
      - SPEC.md
      - MECH.md

jobs:
  rehydration-check:
    name: Verify rehydrated documents are clean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2

      - name: Rehydrate SPEC.md
        run: |
          cp SPEC.md SPEC.md.before
          python3 tools/rehydrate_spec.py
          
      - name: Check SPEC.md (content only, ignore timestamp)
        run: |
          # Compare SPEC.md ignoring the "Last rehydrated:" line
          if ! diff <(grep -v "Last rehydrated:" SPEC.md.before) <(grep -v "Last rehydrated:" SPEC.md) >/dev/null 2>&1; then
            echo "ERROR: SPEC.md has content changes after rehydration"
            echo "Diff (excluding timestamp):"
            diff <(grep -v "Last rehydrated:" SPEC.md.before) <(grep -v "Last rehydrated:" SPEC.md) || true
            exit 1
          fi
          echo "✓ SPEC.md content is up to date (timestamp may differ)"

      - name: Rehydrate MECH.md
        run: |
          cp MECH.md MECH.md.before
          python3 tools/rehydrate_mech.py

      - name: Check MECH.md (content only, ignore timestamp)
        run: |
          # Compare MECH.md ignoring the "Last rehydrated:" line
          if ! diff <(grep -v "Last rehydrated:" MECH.md.before) <(grep -v "Last rehydrated:" MECH.md) >/dev/null 2>&1; then
            echo "ERROR: MECH.md has content changes after rehydration"
            echo "Diff (excluding timestamp):"
            diff <(grep -v "Last rehydrated:" MECH.md.before) <(grep -v "Last rehydrated:" MECH.md) || true
            exit 1
          fi
          echo "✓ MECH.md content is up to date (timestamp may differ)"

      - name: Rehydrate README.md
        run: |
          cp README.md README.md.before
          python3 tools/rehydrate_readme_structure.py

      - name: Check README.md
        run: |
          if ! diff README.md.before README.md >/dev/null 2>&1; then
            echo "ERROR: README.md changed after rehydration"
            echo "Diff:"
            diff README.md.before README.md || true
            exit 1
          fi
          echo "✓ README.md is up to date"

      - name: Summary
        run: |
          echo "✓ All rehydrated documents are up to date"
          echo "  (timestamps in SPEC.md and MECH.md are allowed to differ)"
