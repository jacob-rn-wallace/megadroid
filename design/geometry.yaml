# Megadroid authoritative geometry parameters
# This file defines physical geometry and packaging constraints for the MVS.
# It is a single source of truth for dimensions used across SPEC and MECH.
# Do not duplicate numeric values from this file in markdown documents.

# GEOMETRY FREEZE STATUS:
# This file defines authoritative mechanical geometry for the Megadroid MVS.
# Values marked as STRUCTURAL are frozen and define load paths, envelopes,
# and mechanical interfaces. Changes require SPEC.md revision and a new tag.
# Values marked as NOMINAL_MVS are valid for the MVS but may evolve post-MVS.

meta:
  scope: "MVS geometry"
  freeze_candidate: true
  notes: >
    Geometry values in this file are considered stable for the Minimum Viable
    System unless explicitly revised via SPEC.md change control.

units:
  length: "mm"
  angle: "degrees"

conventions:
  angle_reference:
    default: "neutral_upright"
    description: >
      Zero degrees corresponds to the neutral upright pose unless explicitly
      overridden in a joint definition.
  coordinate_system:
    handedness: "right"
    vertical_axis: "z"

anthropometrics:
  thigh_length_mm: 300          # STRUCTURAL — hip↔knee kinematic reach
  shin_length_mm: 300           # STRUCTURAL — knee↔ankle kinematic reach
  ankle_to_sole_offset_mm: 80   # NOMINAL_MVS — flat sole plate MVS module (not a "ball
                                 # foot"; see SPEC.md Sec 5 and MECH.md Sec 4.3/5.4). This
                                 # value predates the ankle_roll gimbal now inserted into
                                 # foot_stack between the ankle pitch assembly and the F/T
                                 # sensor; it may need a small increase to accommodate that
                                 # gimbal's stack height once physically dimensioned.
                                 # Placeholder, not yet revised, pending P6 physical build.
  notes: >
    Segment lengths are center-to-center joint distances and exclude joint
    housing thickness and end-effector stackups.

leg_structure:
  twin_rail:
    inner_face_spacing_mm: 100  # STRUCTURAL — defines load path & gearbox envelope
    rationale: >
      Matches Hubo-style twin-rail spacing to provide high bending stiffness,
      clear load paths, and compatibility with box-bulkhead construction.

joints:
  shafting:
    standard_diameter_mm: 12
    material: "steel"
    rationale: >
      Standard shaft diameter used for all primary joint outputs to simplify
      bearing selection, hub design, and pulley bores.

  bearing_support:
    preferred_configuration: "double_shear"
    allow_single_shear: false

transmission:
  belts:
    standard:
      type: "HTD"
      pitch_mm: 5
      width_mm: 15
      rationale: >
        Single standardized belt pitch and width used across all joints to
        minimize part variety, simplify sourcing, and improve serviceability.

lower_leg_module:
  interface:
    knee_to_module:
      mechanical_standard: true
      preserves_joint_axis: true
      preserves_joint_encoder: true
    compatibility:
      mvs:
        ankle_pitch_actuated: true      # MVS ankle pitch is actuated
        ankle_roll_actuated: true       # Deliberately kept actuated for the time
                                         # being (2026-09-09 decision) -- lateral
                                         # push-recovery investigation found the
                                         # actuated roll axes (ankle_roll, hip_roll,
                                         # torso_roll) are the right authority for
                                         # this, even though the current control
                                         # software doesn't yet exploit it well; see
                                         # design/joints.yaml's ankle_roll entry and
                                         # tools/CLAUDE.md for the full history
      possible_future_direction:
        ankle_roll_actuated: false      # NOT a committed plan -- a passive spring-
                                         # centered joint remains a possible future
                                         # simplification, revisit only if a spring
                                         # stiffness is shown not to defeat its own
                                         # compliance purpose. Deferred, not
                                         # scheduled, as of the 2026-09-09 decision
                                         # to keep all joints actuated for now.

  definition: >
    The lower-leg module is the complete shank structural assembly from the knee
    output interface down to its distal termination bulkhead (twin rails, bulkheads,
    and any skins/brackets rigidly part of the shank). The distal termination bulkhead
    provides the mounting face for the end-of-limb F/T sensor, such that the sensor is
    located immediately proximal to the foot/end-effector.

  boundaries:
    proximal_boundary: knee_output_interface
    distal_boundary: ft_sensor_mounting_face

  notes: >
    Lower-leg modules are swappable without redesigning pelvis, thigh, or knee
    assemblies. The MVS module currently includes two actuated ankle joints
    (pitch and, temporarily, roll — see compatibility.mvs above); a future
    variant is planned to return ankle roll to a passive, spring-centered
    joint while preserving the knee-to-module mechanical standard and encoder
    strategy.

foot_stack:
  order:
    - knee_output
    - lower_leg_module
    - ankle_roll
    - ft_sensor
    - foot
  constraints:
    ft_sensor_load_path: "axial_only"
    bending_moments_allowed: false
  sole:
    compliant_pad: true
    contact_timeconst_s: 0.05      # PLACEHOLDER -- see rationale below. This is a
                                    # PHYSICAL property of the sole pad, not a tuning
                                    # knob, and it is not yet measured.
    contact_dampratio: 1.0
    rationale: >
      BOM.csv has always specified a "Flat Sole Plate Assembly (compliant sole
      pad) -- rigid plate + compliant pad for vertical shock absorption", but the
      generated MuJoCo model represented the foot as a RIGID box on a rigid plane
      with default contact parameters. The simulation was therefore modelling a
      robot that was never designed, and sim_zmp_balance.py's own docstring had
      already noticed the consequence without connecting it: MuJoCo's box-plane
      contact "activates different corner subsets frame to frame", i.e. the ground
      reaction force is discontinuous tick to tick. That was treated as sensor
      noise and filtered; it is actually noise in the physics, and every
      controller in this project has been fighting it.
    measured_effect: >
      Contact compliance dominates this robot's disturbance behaviour. Sweeping
      the timeconst (2026-09-10, 10N lateral push, 12 timings, n=12):
        0.02 (rigid, previous): 0/12 survived
        0.03: 0/12   0.04: 2/12   0.05: 9/12   0.06: 11/12   0.07: 3/12
      Eleven separate control mechanisms had previously failed to move push
      recovery at all. A contact-model correction moves it from 0/12 to 9/12.
      There is a genuine tradeoff against nominal walking range: 0.03 walks
      cleanly to n=20 where rigid falls, while 0.06+ degrades long-horizon
      walking (n=16 goes 6.85 -> 16.05deg).
    why_this_value: >
      0.05 is chosen as a physically plausible mid-range value for a rubber sole
      pad that preserves the nominal walking range (clean to n=16, marginal at
      n=20) while recovering most of the push benefit. It is NOT chosen by
      optimising the simulation score -- 0.06 scores better on pushes and worse
      on walking, and picking on score would repeat exactly the model-flattering
      this project has spent effort correcting elsewhere.
      MUST BE MEASURED IN P6 against the real pad. The sweep above shows outcomes
      are highly sensitive to it, so an unmeasured value means the disturbance
      results carry that uncertainty.
  notes: >
    Stack order and constraints ensure force/torque sensors are not subjected
    to parasitic bending moments. Both ankle axes (pitch, bundled inside
    lower_leg_module, and the roll axis listed explicitly here) sit proximal
    to the F/T sensor, so the sensor measures net force/moment after both.
    The F/T sensor's own form factor and mounting spec are defined in
    design/sensors.yaml, not here.

torso:
  structure:
    role: "primary load path between legs"
    stiffness_requirement:
      description: >
        Structural stiffness must be sufficient to prevent measurable coupling
        between left and right leg motions during quasi-static gait.

# NOTE:
# Lower-leg internal geometry may change for FULL-system variants,
# but knee interface geometry and structural dimensions above must
# remain compatible unless SPEC.md is explicitly revised.