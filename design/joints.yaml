# Megadroid authoritative design parameters
# This file is a single source of truth.
# Do not duplicate values in markdown documents.

# Conventions:
# - actuated: whether the joint is physically motorized in any configuration
# - variants.MVS / variants.FULL: whether the joint is physically installed
#   in that configuration (driven, for actuated joints; free-to-move within
#   its passive mechanism, for non-actuated joints like ankle_roll)
# - passive_type: for a non-actuated but installed joint, how it behaves
#   mechanically (e.g. "spring_centered"). Absent/null for actuated joints
#   and for joints that aren't installed at all.

meta:
  mvs_dof_total: 15    # declared expected total; validator checks counted value against this
                       # 2026-10-27 design revision: 13 -> 15. Legs go from 5 to 6 actuated DOF
                       # each (hip_yaw added, ahead of hip_roll in the chain). See hip_yaw below.

joints:
  hip_yaw:
    type: revolute
    axis: yaw
    location: hip
    actuated: true    # DESIGN REVISION 2026-10-27: the MVS leg is 6-DOF from the start.
                       # Before this the legs had 5 actuated DOF (hip_pitch, hip_roll,
                       # knee_pitch, ankle_pitch, ankle_roll) and MECH.md described hip yaw
                       # as "structurally present but locked". It is now an actuated MVS
                       # joint. Chain order is hip_yaw -> hip_roll -> hip_pitch (Hubo
                       # order); the three hip axes meet at one point, as hip_roll and
                       # hip_pitch already did. The walking controllers do NOT use it yet:
                       # they hold it at 0, so the validated gaits keep their planar leg
                       # model. Turning, foot placement yaw and hip-yaw reaction torque
                       # are future work (tools/CLAUDE.md, 2026-10-27).
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -30   # PLACEHOLDER -- nominal range estimate, not yet engineered.
      max: 30    # Sized to the other hip axes (hip_roll is +-30). Revise at P6.
    nominal_stand_deg: 0

  hip_pitch:
    type: revolute
    axis: pitch
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: -30
      max: 110
    nominal_stand_deg: 0

  hip_roll:
    type: revolute
    axis: roll
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  knee_pitch:
    type: revolute
    axis: pitch
    location: knee
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: 0
      max: 140
    nominal_stand_deg: 12

  ankle_pitch:
    type: revolute
    axis: pitch
    location: ankle
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: foot_flat
    limits_deg:
      min: -30    # plantarflexion; 2× functional walking minimum of 15° (orthofixar.com)
      max: 30     # dorsiflexion; covers 15–20° functional walking + stair requirement (blkpn.com)
    nominal_stand_deg: 0

  ankle_roll:
    type: revolute
    axis: roll
    location: ankle
    actuated: true    # Deliberately kept actuated for the time being (2026-09-09
                       # decision) -- previously framed as an interim workaround
                       # with a committed plan to revert to passive spring-centered.
                       # That plan is now deferred, not scheduled: a full session of
                       # lateral push-recovery investigation found the actuated roll
                       # axes (ankle_roll here, plus hip_roll and torso_roll) are
                       # the physically correct authority for this -- capturability
                       # theory and real hardware (M2V2, Sarcos Primus) both use
                       # actuated ankle/CoP control as the dominant push-recovery
                       # lever -- even though the walking control SOFTWARE doesn't
                       # yet exploit that authority well (six mechanisms tried and
                       # failed this session, root cause traced to a footstep-
                       # placement reference-point bug, not missing actuation --
                       # see tools/CLAUDE.md). Originally added because simulation
                       # found the walking controllers have no lateral (roll-axis)
                       # feedback at all; leaving ankle_roll passive with any
                       # physically plausible spring stiffness let it wobble
                       # uncontrolled and both gaits fell (~90+deg tilt). A generic
                       # position servo holding a constant target turns out to be
                       # just as unstable as an equivalent passive spring on its
                       # own (both gaits still fall, ~87-96deg) -- actuation alone
                       # isn't sufficient, it needs the right control law on top,
                       # which is the open work. A passive spring-centered ankle_
                       # roll remains a possible future simplification, not a
                       # committed direction -- see tools/CLAUDE.md's dated entries
                       # for the full experiment history.
    variants:
      MVS: true
      FULL: true
    angle_reference: foot_flat
    limits_deg:
      min: -15   # PLACEHOLDER — nominal range estimate, not yet engineered.
      max: 15    # Revise once the physical mechanism is dimensioned (P6).
    nominal_stand_deg: 0

  torso_pitch:
    type: revolute
    axis: pitch
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  torso_roll:
    type: revolute
    axis: roll
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -20
      max: 20
    nominal_stand_deg: 0

  torso_yaw:
    type: revolute
    axis: yaw
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -45
      max: 45
    nominal_stand_deg: 0