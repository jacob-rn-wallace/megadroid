# Megadroid authoritative design parameters
# This file is a single source of truth.
# Do not duplicate values in markdown documents.

# Conventions:
# - actuated: whether the joint is physically motorized in any configuration
# - variants.MVS / variants.FULL: whether the joint is installed and active
#   in that configuration

meta:
  mvs_dof_total: 11    # declared expected total; validator checks counted value against this

joints:
  hip_pitch:
    type: revolute
    axis: pitch
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: -30
      max: 110
    nominal_stand_deg: 0

  hip_roll:
    type: revolute
    axis: roll
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  knee_pitch:
    type: revolute
    axis: pitch
    location: knee
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: 0
      max: 140
    nominal_stand_deg: 12

  ankle_pitch:
    type: revolute
    axis: pitch
    location: ankle
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: foot_flat
    limits_deg:
      min: -30    # plantarflexion; 2× functional walking minimum of 15° (orthofixar.com)
      max: 30     # dorsiflexion; covers 15–20° functional walking + stair requirement (blkpn.com)
    nominal_stand_deg: 0

  ankle_roll:
    type: revolute
    axis: roll
    location: ankle
    actuated: false
    variants:
      MVS: false
      FULL: true
    limits_deg: null
             
  torso_pitch:
    type: revolute
    axis: pitch
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  torso_roll:
    type: revolute
    axis: roll
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -20
      max: 20
    nominal_stand_deg: 0

  torso_yaw:
    type: revolute
    axis: yaw
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -45
      max: 45
    nominal_stand_deg: 0