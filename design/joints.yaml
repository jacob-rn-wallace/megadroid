# Megadroid authoritative design parameters
# This file is a single source of truth.
# Do not duplicate values in markdown documents.

# Conventions:
# - actuated: whether the joint is physically motorized in any configuration
# - variants.MVS / variants.FULL: whether the joint is physically installed
#   in that configuration (driven, for actuated joints; free-to-move within
#   its passive mechanism, for non-actuated joints like ankle_roll)
# - passive_type: for a non-actuated but installed joint, how it behaves
#   mechanically (e.g. "spring_centered"). Absent/null for actuated joints
#   and for joints that aren't installed at all.

meta:
  mvs_dof_total: 13    # declared expected total; validator checks counted value against this

joints:
  hip_pitch:
    type: revolute
    axis: pitch
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: -30
      max: 110
    nominal_stand_deg: 0

  hip_roll:
    type: revolute
    axis: roll
    location: hip
    actuated: true
    variants:
      MVS: true
      FULL: true
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  knee_pitch:
    type: revolute
    axis: pitch
    location: knee
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: straight_leg
    limits_deg:
      min: 0
      max: 140
    nominal_stand_deg: 12

  ankle_pitch:
    type: revolute
    axis: pitch
    location: ankle
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: foot_flat
    limits_deg:
      min: -30    # plantarflexion; 2× functional walking minimum of 15° (orthofixar.com)
      max: 30     # dorsiflexion; covers 15–20° functional walking + stair requirement (blkpn.com)
    nominal_stand_deg: 0

  ankle_roll:
    type: revolute
    axis: roll
    location: ankle
    actuated: true    # INTERIM — temporarily motorized, not the intended end state.
                       # Simulation found the walking controllers have no lateral
                       # (roll-axis) feedback at all; leaving ankle_roll passive with
                       # any physically plausible spring stiffness let it wobble
                       # uncontrolled and both gaits fell (~90+deg tilt). Actuating
                       # it did NOT fix this on its own -- a generic position servo
                       # holding a constant target turns out to be just as unstable
                       # as an equivalent passive spring (both gaits still fall,
                       # ~87-96deg), and the result is sensitively dependent on
                       # ankle_roll's own mass, not just its stiffness/gain. This is
                       # now the real, committed MVS configuration on mechanical/DOF/
                       # BOM terms, but walking is NOT yet restored by it. Real fix
                       # needs local lateral feedback (closer to HUBO's architecture)
                       # or a deliberate control re-tune -- see tools/CLAUDE.md's
                       # dated entry for the full experiment and data.
    variants:
      MVS: true
      FULL: true
    angle_reference: foot_flat
    limits_deg:
      min: -15   # PLACEHOLDER — nominal range estimate, not yet engineered.
      max: 15    # Revise once the physical mechanism is dimensioned (P6).
    nominal_stand_deg: 0

  torso_pitch:
    type: revolute
    axis: pitch
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -30
      max: 30
    nominal_stand_deg: 0

  torso_roll:
    type: revolute
    axis: roll
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -20
      max: 20
    nominal_stand_deg: 0

  torso_yaw:
    type: revolute
    axis: yaw
    location: torso
    actuated: true
    variants:
      MVS: true
      FULL: true
    angle_reference: neutral_upright
    limits_deg:
      min: -45
      max: 45
    nominal_stand_deg: 0