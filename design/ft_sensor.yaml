# Megadroid F/T sensor -- internal design parameters and sources.
# The robot-facing interface (envelope, mounting, load path) is in design/sensors.yaml.
# This file holds what the sensor's own design study needs. Kept separate so
# hardware/ft_sensor/ can be split into its own repository later.
# Status: STUDY INPUTS. Nothing here is a chosen design yet.

load_cell:
  part: "harvested Wii Fit Balance Board bar cell; MLC714N is the drop-in replacement"
  dimensions_mm:                 # measured by the builder, 2026-10-21 (rough CAD model)
    length: 42.25
    width: 13.25
    thickness: 8.5
  mounting:
    thread: "M6"
    hole_spacing_mm: 30          # centre to centre, symmetric about the cell centre
    hole_axis: "through the 8.5 mm thickness"   # PLACEHOLDER reading of the builder's model
  sensitive_axis: >
    Bending beam: reads force perpendicular to the 42.25 x 13.25 face, one end
    fixed and the other loaded. Axial and off-axis loads must not reach the cell.
  rating:
    rated_load_kg: 75            # UNVERIFIED -- reseller listings (Alibaba) offer 75/150/250 kg
                                 # variants; 75 matches the Wii board's published 150 kg
                                 # sensing / ~300 kg structural limits
    rated_output_mv_per_v: 0.5   # UNVERIFIED -- reseller listing
    bridge_ohm: 1000             # UNVERIFIED -- reseller listing
    safe_overload_fraction: 1.5  # UNVERIFIED
    ultimate_overload_fraction: 2.0   # UNVERIFIED
    excitation_v: 5              # listed range 5-10 V
  verification: "Test H (docs/P4_JOINT_TEST_RIG.md) -- bench-characterise one cell before any layout is trusted"

study_assumptions:
  # The builder's rough sketch used six cells in a Stewart-type arrangement
  # between two end caps. These loads are the study's ASSUMPTIONS, not measurements.
  peak_wrench:
    fz_n: 300
    fx_n: 150
    fy_n: 150
    mx_nm: 15
    my_nm: 15
    mz_nm: 3
  nominal_stand_fz_n: 47         # per foot at 9.6 kg (tools/CLAUDE.md)
  noise_floor_uv: 2.0            # ASSUMED bridge-referred noise (peak to peak, ~ADS1256-class)

sim_measured_loads:
  # tools/log_ft_loads.py, 2026-10-21: sim_walk_recede, 16 nominal steps plus lateral and
  # sagittal pelvis pushes at 5 and 10 N (6 timings each, surviving runs only: 19 of 24).
  # Per foot, both feet pooled, absolute values, at the ANKLE (the sensor site), at the
  # committed 11.2 N.m cap, 175 mm hip spacing, 9.6 kg, compliant sole.
  # A floor on real loads: the contact model is smoother than a real heel strike, and
  # the controller only walks at ~0.4-0.5 km/h.
  peak:  {fx_n: 49.9, fy_n: 46.7, fz_n: 174.6, mx_nm: 6.9, my_nm: 10.0, mz_nm: 5.0}
  p99:   {fx_n: 27.2, fy_n: 23.1, fz_n: 112.2, mx_nm: 4.5, my_nm: 7.0, mz_nm: 2.6}
  vs_assumed_peak: >
    Every channel is below the study's assumed peak except Mz, which was assumed 3 N.m and
    measured 5.0. Fz peak is 58% of the assumed 300 N, shear about a third of 150 N.

design_basis:
  # First-principles choices for the layout synthesis (hardware/ft_sensor/design_synthesis.py).
  # ALL ASSUMPTIONS to be confirmed or replaced -- none is measured.
  member_principle: >
    Six two-force members. Each is a bending-beam cell in series with a rod. The cell's
    sensitive axis is its bolt axis (through its 8.5 mm thickness): one M6 bolt fixes it to
    a cap, the other (30 mm away) takes the load. The rod joins that free bolt to the other
    cap and must carry axial load only, so it needs a pivot at each end (two machined
    thin-neck flexures per rod). Rod ends (ball joints) are avoided: friction and play
    show up as hysteresis in a sensor.
  envelope_decision: >
    2026-10-21: the 88.85 mm across-flats hexagon in sensors.yaml is the requirement. The builder's
    CAD caps (94.8-99.6 mm) were a rough concept and are not the limit.
  fabrication_access: >
    2026-10-21: builder has lathe and CNC access, so turned flexure rods and angled wedge blocks
    are in scope (the ball-joint alternative is not needed on fabrication grounds).
  cap_thickness_mm: 10           # each end cap: M6 mounting and stiffness
  cell_standoff_mm: 3            # spacer under the fixed end so the free end can deflect
  hex_wall_margin_mm: 0.5        # parts keep this far inside the envelope. The builder's concept has the
                                 # cells AS the outer surface, so no wall margin is assumed (was 3, wrong)
  min_clearance_mm: 0.5          # between non-mating parts. The concept has ~0.7 mm between the two
                                 # cells of a pair, so 1.5 rejected the builder's own design
  rod_section_mm: 6              # M6 rod; necks are thinner but the envelope is this
  range_load_factor: 1.5         # sensing range: the cell must stay within its rating at sim peak x this
  abuse_load_factor: 3.0         # structure (rods, bolts, caps) must not yield at sim peak x this (a fall);
                                 # overload stops are needed so the cell is not asked to carry it
  noise_cell_equivalent_n: 0.59  # from noise_floor_uv above, per cell
  targets:                       # what the controllers and the sizing need
    resolution_mx_my_nm: 0.05    # ~2 mm CoP at 47 N is ~0.1 N.m; this is half of that
    resolution_mz_nm: 0.1
    resolution_fz_n: 1.0
    resolution_shear_n: 1.0
    worst_cell_fraction_of_rating: 0.9

open_question:
  # Raised 2026-10-21 reading the builder's Stewart concept (hardware/ft_sensor/cad/).
  load_path_fraction: >
    The concept bolts each cell to a cap at both ends with no rods, so the cell's stiff
    directions carry load in parallel with its sensing direction. A three-spring model
    (ESTIMATED stiffnesses) gave 2-7% of the signal of an ideal strut layout. Unmeasured:
    docs/P4_JOINT_TEST_RIG.md Test H2/H3 measure it. Below f ~ 0.6 the layout study's
    resolution targets are not met; below ~ 0.2 the cells need series rods with pivots.

sizing_basis:
  # Closed-form sizing assumptions (hardware/ft_sensor/sizing.py). ALL ASSUMPTIONS to be
  # confirmed against what can actually be bought and machined. Units: mm, N, MPa.
  materials:
    7075-T6:   {youngs_mpa: 71700, yield_mpa: 503, endurance_mpa: 159}    # 5e8-cycle typical
    6061-T6:   {youngs_mpa: 68900, yield_mpa: 276, endurance_mpa: 96}
    17-4PH-H1025: {youngs_mpa: 197000, yield_mpa: 1000, endurance_mpa: 450}
  parts:
    rod: 7075-T6                 # turned rod with two thin-neck flexures (needs a lathe)
    cap_and_pads: 7075-T6
  bolt: {size: M6, grade: 12.9, stress_area_mm2: 20.1, proof_mpa: 970, preload_fraction_of_proof: 0.6}
                                 # 12.9 alloy steel, not A2-70 (proof 450): with A2-70 the cell's fixed-end joint opens at
                                 # ~636 N of member force, below the 736 N rating; 12.9 lifts that to ~1380 N
  thread_engagement_mm: 9        # into aluminium; 1.5 d
  safety_factor_design: 1.5      # on yield at the sensing-range load (sim peak x range_load_factor)
  misalignment_mm: 0.05          # lateral offset between the two rod ends (machined hole positions, adjustable
                                 # stops). 0.2 mm made every neck fail: the rod is short, so it is very sensitive
  shoulder_mm: 3.0               # rod shoulder against the cell face, plus washer
  rod_body_mm: 3.0               # unreduced rod between the two necks
  fixed_end_contact_length_mm: 12.7   # clamp footprint under the cell's fixed end (the pad). 21.1 (the whole fixed half)
                                      # would hold the joint to ~1370 N but collides with neighbouring pads and leaves the
                                      # envelope; at 12.7 mm the joint opens above ~826 N of member force (12.9 bolts), so
                                      # the stop is set at 750 N. UNVERIFIED: how the cell is meant to be mounted and what
                                      # its rating assumes (Test H)

stop_basis:
  # Result 2026-10-21 (hardware/ft_sensor/SYNTHESIS_RESULTS.md): a central pin-in-bore stop is NOT practical.
  # The cell and rods are so stiff (member ~4-13 MN/m) that the safe cap displacement before a cell reaches
  # the stop force is a few microns radially and ~2 um of key-slot twist. No stop is designed for v1: the cell's
  # 150% safe overload (1104 N) covers up to ~3x the simulated peak. If Test H shows the fixed-end joint or the
  # cell needs protection beyond that, use member-level shim-set stops (gap = stop force / cell stiffness,
  # roughly 35-150 um), not a global pin.
  keepout_radius_mm: 12          # clear column through the middle (cables, mounting); the layout keeps to it
  stop_member_force_n: 750       # reference force for any future member-level stop (102% of the 75 kg rating;
                                 # the fixed-end joint opens above ~826 N, the sensing-range load is ~544 N)

build_candidate:
  # The layout and part dimensions the CAD model (hardware/ft_sensor/cad_build.py) is built from.
  # Layout: design_synthesis.py --case rods --symmetry inv --cap-thickness 3 --rod-min 21 --seed 3 (hexagon, 75 kg cell).
  # NOT sized by FEA and NOT built. The cell rating, stiffness and mounting are unmeasured (Test H, H2, H3, R).
  status: "model only; supersedes the 6 mm-cap inversion candidate, whose far-end boss was counted as rod length"
  symmetry: inversion                     # a half turn about a horizontal axis loses one wrench axis (rank 5)
  layout: {r: 34.4, delta: 51.2, c0: 37.0, alpha: 54.5, psi: 74.0, lenmode: 0, sc: 1.0, zc: 19.7}
  cap_thickness_mm: 3.0
  min_free_rod_mm: 21.0                   # cell face to boss face: end block 6.5 + two 4.5 necks + body + hex 3 + shim
  rated_kg: 75
  boss: {width_mm: 10.0, relief_mm: 1.0}  # relief: depth beyond the bare minimum, so a thin spanner reaches the rod hex
  rod:
    material: 7075-T6
    hex_af_mm: 8.0                        # wrench flats sit between neck and stud so tightening torque never passes a neck
    shoulder_mm: 3.0                      # hex at the boss end
    a_end_mm: 6.5                         # hex block at the cell end, carries a blind M6 thread
    a_thread_depth_mm: 6.0
    neck_d_mm: 2.4                        # fatigue from assembly misalignment (0.05 mm) governs and scales as d/l:
    neck_l_mm: 4.5                        # 2.1 x 3.5 has no margin (107 vs 106 MPa), 2.4 x 4.5 has 16%
    neck_fillet_mm: 0.3
    body_d_mm: 6.0
    stud: {thread: M6x1, into_boss_mm: 8.0}   # boss end only; the cell end is a female thread
  shim_nominal_mm: 0.25                   # selected 0 to 0.5 mm at assembly to zero the unloaded cell
  cell_hole_ream_mm: {fixed: 6.1, free: 7.0}   # the cell's two M6 threaded holes are reamed; the free-end hole is oversize (0.5 mm
                                               # each way) so the two cap halves need not close to better than that
