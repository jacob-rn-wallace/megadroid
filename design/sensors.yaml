# Megadroid authoritative sensing-strategy parameters
# This file is the single source of truth for all sensing modalities:
# joint position sensing, motor-side sensing exclusions, and end-of-limb
# force/torque sensing.
# Do not duplicate values from this file in markdown documents.

meta:
  scope: "MVS sensing strategy"
  notes: >
    Sensing decisions in this file apply to both leg joints and torso joints
    unless otherwise noted. Changes require SPEC.md revision (see SPEC.md
    Section 15, Change Control) since sensing modality is a locked
    architectural assumption.

joint_position_sensing:
  type: "joint-mounted absolute encoder"
  measures: "true joint output angle"
  motor_mounted_encoders_allowed: false
  rationale: >
    A joint-mounted absolute encoder measures true output angle directly,
    avoiding the backlash and belt-stretch error a motor-side encoder would
    introduce through the gear reduction.

motor_sensing:
  current_sensing: false
  velocity_sensing: false
  notes: >
    No motor current or motor-side velocity telemetry in the MVS control
    architecture, consistent with position-only control (no torque or
    impedance control).

inertial_sensing:
  imu:
    present: true
    axes: 6
    gyroscope: true
    accelerometer: true
    magnetometer: false
    mounting_location: "pelvis, at the pelvis_center base frame origin"
    cost_accounting: "included"
    added: "2026-09-10"
    rationale: >
      ADDED 2026-09-10 as a deliberate sensor-strategy revision (SPEC.md
      Section 15.3). Without an IMU the MVS can measure joint angles and
      foot force/torque, but NOT pelvis orientation or absolute CoM
      velocity -- and every model-based balance method this project's
      reference library points at (ZMP preview control, DCM/capture-point
      tracking, LIPM MPC, capturability-based control) requires CoM
      velocity as a feedback state. Simulation had been masking this: the
      P3 controllers read MuJoCo's privileged world-frame CoM position and
      velocity directly, a state the robot as previously specified could
      never have produced. The IMU closes that gap and is what makes a
      real state estimator possible.
    magnetometer_rationale: >
      Deliberately omitted. Thirteen brushed DC motors operating close to
      the sensor make indoor magnetic heading unreliable, and a
      magnetometer would add a calibration burden for a measurement the
      gait does not need: absolute yaw is not required for balance, and
      relative yaw is recoverable from leg odometry against the planted
      foot. Accepted consequence -- estimated yaw drifts slowly with no
      absolute reference.
    cost_rationale: >
      Included in MVS cost accounting, unlike the F/T sensors below. A
      6-axis MEMS IMU is a low-cost commodity part, so excluding it would
      misrepresent the build cost rather than protect the cost target.

end_of_limb_sensing:
  ft_sensor:
    form_factor:
      shape: "cylindrical"
      diameter_mm: 107          # STRUCTURAL — mechanical envelope constraint
      height_mm: 56              # STRUCTURAL — mechanical envelope constraint
    mounting_location: distal_face_of_lower_leg_module
    mechanical_constraint: "hard"
    cost_accounting: "excluded"
    cost_rationale: >
      Excluded because the real cost is near zero, not because it is set
      aside from the target -- unlike a component excluded for being
      out of MVS scope, this one is excluded because accounting for it
      properly would UNDERSTATE how cheap the build is. Each 6-DOF
      sensor is built from six harvested Wii Fit Balance Board load
      cells -- four bar-type cells per board, arranged Stewart-platform
      style between two custom-machined aluminium discs within the
      107mm/56mm envelope above. Three boards (twelve cells) supply
      exactly two 6-DOF sensors, one per foot. Used Balance Boards cost
      next to nothing, against hundreds of dollars per new bar load cell
      of similar rating, putting each sensor at well under $100 and
      potentially far less. Recorded 2026-09-10. The signal-chain
      electronics this sourcing requires (multi-channel amplification
      and fast acquisition -- the commodity HX711 is too slow for a
      walking control loop) are a real cost and are NOT covered by this
      exclusion; see docs/P4_JOINT_TEST_RIG.md's Load cells section for
      that caveat and for the bending-beam mounting orientation these
      cells need.
    load_path_requirement: >
      Ground reaction forces must pass axially through the sensor before
      entering the lower-leg module structure. This applies regardless of how
      many joints sit proximal to the sensor in the foot_stack — including
      ankle_roll (design/joints.yaml) as well as ankle pitch — the constraint
      is on the sensor's own mounting, not on which mechanism delivers force
      to it.
    notes: >
      The F/T sensor is mounted directly to the distal termination bulkhead
      of the lower-leg module, immediately proximal to the foot/end-effector
      and distal to both ankle axes (pitch and roll — see design/joints.yaml's
      ankle_roll entry, including its current interim actuation status). Its
      geometry is treated as a fixed structural envelope and must be fully
      accommodated by the shank design. Physical stack order and the
      no-bending-moment load-path constraint are defined in
      design/geometry.yaml's foot_stack block.
